name: Build LineageOS-Hide

on:
  push:
    branches: [main, master]
    tags:     ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch dependencies
        run: |
          # ── Dobby ─────────────────────────────────────────────────────────
          # Using chiteroman/Dobby: fixes the arm64 ADRP @PAGE/@PAGEOFF
          # relocation error ("error: invalid symbol kind for ADRP relocation")
          # that NDK r26's clang produces with jmpews/Dobby master's
          # ClosureTrampolineBridge/arm64 asm. This is the community-accepted
          # working fork for Android builds.
          git clone --depth=1 https://github.com/JingMatrix/Dobby native/libs/dobby

          # ── zygisk-module-sample ──────────────────────────────────────────
          # Header-only (zygisk.hpp). Latest HEAD is fine.
          git clone --depth=1 \
            https://github.com/topjohnwu/zygisk-module-sample native/libs/zygisk

          # ── LSPlant ───────────────────────────────────────────────────────
          # Pinned to tag v6.4. Master has migrated to C++23 modules
          # (import std;) and can no longer be compiled as a plain TU.
          git clone --depth=1 --branch v6.4 \
            https://github.com/LSPosed/LSPlant native/libs/lsplant

          # LSPlant v6.4 needs its dex_builder companion (slicer + parallel-hashmap).
          # This is a submodule of LSPlant's own repo so the gitlinks are there.
          git -C native/libs/lsplant submodule update --init --recursive \
            lsplant/src/main/jni/external/dex_builder

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 zip

      - name: Build LineageOS-Hide
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh Release

      - name: Verify module contents
        run: |
          unzip -l lineagehide.zip
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l lineagehide.zip | grep -q "zygisk/${abi}.so" \
              || { echo "ERROR: zygisk/${abi}.so missing from module zip"; exit 1; }
          done
          unzip -l lineagehide.zip | grep -q "assets/hooks.dex" \
            || { echo "ERROR: assets/hooks.dex missing from module zip"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineagehide-${{ github.run_id }}
          path: lineagehide.zip
