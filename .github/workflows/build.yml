name: Build LineageOS-Hide

on:
  push:
    branches: [main, master]
    tags:     ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false   # manual below — only init what the build needs

      - name: Checkout submodules
        run: |
          # Pins matter: dobby is pinned pre-refactor (master's arm64 asm uses
          # Mach-O-only @PAGE relocations that NDK r26's clang rejects), and
          # lsplant is pinned to v6.4 (master now requires C++23 modules).
          git submodule update --init native/libs/dobby
          git submodule update --init native/libs/zygisk
          git submodule update --init native/libs/lsplant

          # LSPlant v6.4 needs its dex_builder companion (slicer + parallel-hashmap)
          cd native/libs/lsplant
          git submodule update --init --recursive lsplant/src/main/jni/external/dex_builder

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 zip

      - name: Build LineageOS-Hide
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh Release

      - name: Verify module contents
        run: |
          unzip -l lineagehide.zip
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l lineagehide.zip | grep -q "zygisk/${abi}.so" \
              || { echo "ERROR: zygisk/${abi}.so missing from module zip"; exit 1; }
          done
          unzip -l lineagehide.zip | grep -q "assets/hooks.dex" \
            || { echo "ERROR: assets/hooks.dex missing from module zip"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineagehide-${{ github.run_id }}
          path: lineagehide.zip
